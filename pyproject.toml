[project]
name = "php-security-auditor"
dynamic = ["version"]
description = "Auditoria defensiva local para vulnerabilidades críticas do PHP"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
php-security-auditor = "php_security_auditor.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
php_security_auditor = ["data/*.json"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "php_security_auditor.VERSION"}
